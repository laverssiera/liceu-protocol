name: Superficie provada pelo genoma

on:
  push:
  pull_request:

jobs:
  superficie-provada:
    # A PRF-0037 do genoma declara uma superficie NESTE repositorio
    # (liceu_protocol/liceu_contract_vectors.py). Sem este passo, o campo
    # `mechanism` seria decorativo: a prova diria cobrir um arquivo que ninguem
    # confere, e o gerador de vetores poderia ser reescrito sem que a prova
    # fosse refeita. A invalidacao acontece ONDE A MUDANCA ACONTECE.
    #
    # O genoma (liceu-genome) e PUBLICO: esta CI o le, pega as provas cujo
    # mechanism.repo e liceu-protocol, recalcula o hash da superficie e falha
    # aqui se mudou. Sem token, e sem ninguem escrever no repositorio de ninguem.
    name: A superficie provada deste repositorio mudou?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3
      # R0F do metodo: `raw.githubusercontent.com` e servido por CDN e pode
      # devolver uma versao ANTERIOR do genoma por alguns minutos. O perigo nao
      # e o falso vermelho, que se re-roda: e o falso VERDE — uma superficie
      # alterada passando porque o detector leu o genoma de ANTES de a prova
      # nova entrar. Aconteceu em 2026-09-23, no 3C273.
      #
      # `git ls-remote` fala o protocolo git, sem CDN no caminho, e devolve o
      # sha autoritativo. Dai em diante tudo e buscado POR SHA, e URL de sha e
      # imutavel: o cache passa a estar sempre certo, em vez de as vezes.
      #
      # O sha fica no log: da para saber QUAL genoma julgou este PR.
      - name: Qual genoma vai julgar (sha autoritativo, sem CDN)
        id: genoma
        run: |
          SHA=$(git ls-remote https://github.com/laverssiera/liceu-genome.git refs/heads/main | cut -f1)
          test -n "$SHA" || { echo "nao consegui o sha do genoma — sem julgar no escuro"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "genoma que vai julgar: $SHA"
      - name: Baixar o detector e o genoma publico
        env:
          SHA: ${{ steps.genoma.outputs.sha }}
        run: |
          curl -fsSL -o /tmp/genome_surface_check.py \
            https://raw.githubusercontent.com/laverssiera/liceu-genome/$SHA/tools/genome_surface_check.py
          curl -fsSL -o /tmp/07-proofs.yaml \
            https://raw.githubusercontent.com/laverssiera/liceu-genome/$SHA/genome/07-proofs.yaml
      - name: A superficie provada deste repositorio mudou?
        run: python /tmp/genome_surface_check.py --repo liceu-protocol --root . --proofs /tmp/07-proofs.yaml
