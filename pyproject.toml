[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liceu-protocol"
# Versao do PACOTE. Os componentes (constitution, conformance_kit, federation_sdk,
# registry_checker, boundary_checker) tem versoes proprias em liceu_protocol/VERSION.
# Bump aqui = novo MANIFEST. Consumidores fixam esta versao (ADR-001: as tres Maes
# validam sob a MESMA lei).
version = "0.19.0"
description = "LICEU 6.0 - Constituicao, registries, conformance kit e Federation SDK (fonte unica)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[tool.setuptools]
packages = ["liceu_protocol"]

[tool.setuptools.package-data]
liceu_protocol = ["*.yaml", "MANIFEST", "VERSION"]
