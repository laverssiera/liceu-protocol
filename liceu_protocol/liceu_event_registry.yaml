resumo:
  contagem_removida: 'REGRA (2026-10-09, titular): derivavel de outro artefato nao se escreve,
    se deriva. Havia CANONICAL_REGISTRY_EVENTS, CONTRACT_IDS e CONTRACT_VERSIONS escritos a
    mao; o primeiro se conta das chaves de `events` aqui, e os outros dois das chaves de
    `contracts` no Contract Registry. Os tres estavam DEFASADOS ate 2026-10-09: diziam 8 /
    10 / 12 onde havia 9 / 11 / 17. A razao da regra: a lista muda e o numero nao, entao a
    manutencao e eterna e o erro e silencioso — dos 48 estados medidos na lei, 47 nao
    denunciariam o proprio erro.'
  IMPLEMENTED_IN_MONOLITH: 0
  nota_do_que_ficou: 'IMPLEMENTED_IN_MONOLITH NAO e derivavel de artefato nenhum: e observacao
    do codigo noutro repositorio, e cai no outro grupo da UNK-0018 — data e procedencia
    obrigatorias, nao derivacao. Hoje ele nao tem nem uma nem outra, e nao esta medido como
    falso: esta medido como AMBIGUO, porque ninguem escreveu o que conta como implementado e
    quatro eventos passaram a ter EMITIDO_COMO_AUDITORIA_NAO_COMO_FATO.'
