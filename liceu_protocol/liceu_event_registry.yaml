  regra: 'Contem SOMENTE eventos promovidos a contrato canonico. Nunca os 649 do discovery. Promocao exige:
    classificacao no ledger + schema + SemVer + dono constitucional. Este registry e a FONTE dos conformance
    tests.'
  promocao: discovery -> ledger (classificado) -> registry (canonico) -> conformance
