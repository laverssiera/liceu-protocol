          - 2. Mae A drena o que esta em curso
          - 3. epoca incrementa e Mae B assume
          - 4. Mae A entra em manutencao
          risco_de_split_brain: NENHUM — a saida e ordenada
          e_o_caso_de_uso_pedido: trabalhar em uma enquanto a outra toca o ecossistema
        nao_planejada:
