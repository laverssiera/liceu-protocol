        inalterado: o requisito DOSSIE_DE_DECISAO permanece
      TESTEMUNHA:
        procedencia: '[DECIDIDO 2026-08-30] terceira Mae que so informa'
        nome: Mae TESTEMUNHA
        topologia_resultante: duas Maes de autoridade (ativa e sucessora) + uma testemunha
