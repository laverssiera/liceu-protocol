        relacao_com_authority_epoch:
          permanecem_juntos: true
          testemunha: PREVINE a promocao indevida
          authority_epoch: CONTEM o dano se a prevencao falhar
          razao: duas camadas independentes. A testemunha pode cair; a epoca nao depende dela para funcionar.
