meta:
  versao: 1.16.0
  status: FINAL
  data: '2026-08-29'
  pendencias_abertas: 0
  adrs_pendentes: 1
  milestone_corrente: M2_FEDERATION_PROTOCOL_AND_STATIC_CONVERGENCE
  changelog_1_4_2: 'PATCH: corrige milestone.current_constitution_version que estava stale em 1.3.0. Nenhum
    invariante alterado. Descoberta empirica -> nova regra R0C no Registry Checker.'
  changelog_1_5_0: 'MINOR: acrescenta federation_scale — enum de 6 degraus, default LOCAL, invariante
    de propagacao e resolucao de planetary como sinonimo de GLOBAL. Nenhum invariante anterior alterado.'
  changelog_1_6_0: 'MINOR: acrescenta federation_cognition, modelando as duas camadas cognitivas (JOHN
    local e JOHN central) e a regra de identidade que as separa. Nenhum invariante anterior alterado;
    nenhum mandato alterado.'
  changelog_1_7_0: 'MINOR: acrescenta federation_authority, modelando a Mae LICEU como autoridade de ultima
    instancia e a delegacao com teto. Revisa a missao do liceu.anchor para guardiao de ciclo de vida.
    may_authorize do ANCHOR inalterado — passa a ser lido como delegado.'
  changelog_1_8_0: 'MINOR: generaliza a delegacao para os 15 monolitos. Corrige a leitura de may_decide=[]
    — passa a significar TETO ZERO, nao ausencia de camada cognitiva. Nenhuma capacidade alterada.'
  changelog_1_9_0: 'MINOR: acrescenta a camada HUMANO como ultima instancia real e o requisito DOSSIE_DE_DECISAO.
    Substitui o fallback que ampliava autonomia na indisponibilidade da Mae.'
  changelog_1_10_0: 'MINOR: acrescenta MAE_REDUNDANTE — topologia ativa-passiva com epoca de autoridade
    monotonica. Humano passa a ser acionado apenas quando as duas Maes estao indisponiveis.'
  changelog_1_11_0: 'MINOR: acrescenta a Mae TESTEMUNHA — terceira instancia que observa e arbitra sem
    NUNCA autorizar. Restaura quorum, fecha a deteccao de dupla queda e passa a ser o montador do dossie
    para o humano.'
  changelog_1_12_0: 'MINOR: (1) precisa a fronteira do ANCHOR — governa continuidade, nao executa manutencao
    fisica; (2) atribui a propriedade constitucional do envelope ao CORE e fixa o nome LICEU Federation
    Envelope; (3) acrescenta camadas transversais e modulos estrategicos, com a regra de que nenhuma governa
    dominio; (4) acrescenta core_dna com a fronteira semantica. Nenhuma capacidade, teto ou contrato alterado.'
  changelog_1_13_0: 'MINOR: ratifica D-037, D-038, D-039 e D-040. Acrescenta liceu.authority como classe
    de autoridade do control plane com 3 instancias e regra de aceitacao no Event Store; posicao do humano;
    modo degradado; comportamento na queda da testemunha; G6 obrigatorio com PASS_PARTIAL proibido.'
  changelog_1_14_0: 'MINOR: campanha LIC-AUTHORITY-PROTOCOL-002. Envelope vNext com 6 campos de autoridade
    e escala, com origem na identidade autenticada; decisao humana como RAMIFICACAO de contingencia com
    escalation_reason e autenticacao forte obrigatoria; identidade semantica de replay com 12 campos;
    verificacao de hash server-side; event_id globalmente unico.'
  changelog_1_15_0: 'PATCH de recuperacao (LIC-PROTOCOL-RECOVERY-003): restaura decision_id, governance_decision_id
    e execution_id no envelope; separa autoridade_da_cadeia de autoridade_do_control_plane; separa campos_exigidos_pelo_protocolo
    de campos_aceitos_pelo_servidor, este ultimo refletindo o CORE real.'
  changelog_1_16_0: 'MINOR (decisao 2026-09-18, levantamento B2): acrescenta o Mandate Plane e o produtor
    liceu.mandate — quem empreende. A cadeia minima exigia planning_request_id no elo 1 sem que a
    Constituicao nomeasse de que dominio vem um pedido de planejamento; "W93F22" era o nome de uma wave
    nunca executada, nao de um produtor. Posicao 0 (mandate.planning.requested) PRECEDE a cadeia minima
    e nao a altera. Principio P08. Nenhuma capacidade, teto ou contrato existente alterado.'
global:
  canonical_envelope:
    procedencia: '[DECIDIDO 2026-08-29]'
    nome: LICEU Federation Envelope
    versao: vNext
    owner: core
    principio: ONE ENVELOPE, MANY DOMAIN PAYLOAD CONTRACTS
    nota: Incorpora as propriedades superiores do envelope do JOHN (lineage, fingerprints deterministicos)
      SEM transferir ownership do contrato federativo ao JOHN. Nao criar mega-schema por dominio.
    campos:
      identidade:
      - event_id
      - event_type
      - producer_id
      contrato:
      - contract_id
      - contract_version
      correlacao:
      - trace_id
      - source_event_id
      - parent_event_id
      - causation_id
      objeto:
      - artifact_id
      - scope
      carga:
      - payload
      - payload_hash
      - envelope_fingerprint
      tempo:
      - observed_at
      - emitted_at
      escala:
      - scale
      autoridade_da_cadeia:
      - decision_id
      - governance_decision_id
      - execution_id
      autoridade_do_control_plane:
      - producer_instance_id
      - authority_role
      - authority_epoch
      - authority_issuer_id
      - activation_certificate_id
    campos_proibidos:
      contract: usar contract_id + contract_version
      meta: lineage e campo de topo, nao aninhado
      signature: usar payload_hash + envelope_fingerprint
    migracao:
    - 'archimedes: trocar `contract` por contract_id+contract_version; emitir artifact_id'
    - 'juridicotech: desaninhar meta{}; remover signature literal'
    - 'cea: contract_version para SemVer; remover resolve_event redundante'
    - 'econotech: corrigir get_event_by_id (le envelope em vez do item)'
    nome_canonico: LICEU Federation Envelope
    propriedade_constitucional: liceu.core
    procedencia_da_implementacao:
      referencia_tecnica: liceu.john
      texto: implementado primeiro no JOHN e a melhor referencia tecnica do ecossistema. A PROPRIEDADE
        constitucional e do CORE.
      NAO_chamar_de: envelope do JOHN
      razao: o CORE guarda identidade, contratos e protocolo. Atribuir o envelope a um produtor de recomendacao
        confundiria quem informa com quem define o protocolo.
      precedente_interno: internal_reference_implementations — implementar primeiro nao e possuir
    REGRA_DE_ORIGEM_DOS_CAMPOS_DE_AUTORIDADE:
      texto: os campos de autoridade vem da IDENTIDADE AUTENTICADA ou do estado do control plane. NUNCA
        do payload livre.
      proibido: aceitar authority_role, authority_epoch, authority_issuer_id ou activation_certificate_id
        declarados pelo produtor no corpo da requisicao
      razao: se o papel vier do payload, qualquer instancia se declara ACTIVE e a topologia de autoridade
        deixa de valer
    campos_novos_vNext:
      scale:
        origem: produtor
        default_na_normalizacao: LOCAL
      producer_instance_id:
        origem: identidade autenticada
      authority_role:
        origem: identidade autenticada
        valores:
        - ACTIVE
        - SUCCESSOR
        - WITNESS
      authority_epoch:
        origem: control plane
        tipo: inteiro monotonico
      authority_issuer_id:
        origem: control plane
      activation_certificate_id:
        origem: control plane
    REGRESSAO_CORRIGIDA:
      id: SOBRESCREVI_O_GRUPO_AUTORIDADE
      o_que_aconteceu: o grupo 'autoridade' continha decision_id, governance_decision_id e execution_id.
        Foi sobrescrito com os campos do control plane, removendo os tres do envelope canonico.
      gravidade: os tres removidos sao exatamente os que forbidden_envelope_fields usa para impedir salto
        de etapa
      correcao: 'dois grupos distintos: autoridade_da_cadeia (quem decidiu, quem governou, quem executou)
        e autoridade_do_control_plane (qual Mae, qual papel, qual epoca)'
      por_que_sao_coisas_diferentes: autoridade_da_cadeia identifica os ATOS da cadeia causal. autoridade_do_control_plane
        identifica QUEM autoriza acima do teto. Um e lineage; o outro e governanca de instancia.
  campos_aceitos_pelo_servidor:
    procedencia: '[CODIGO] cv-backend-core/app/main.py:617 FederationEventPublishRequest'
    campos:
    - event_id
    - event_type
    - source
    - contract_id
    - contract_version
    - trace_id
    - source_event_id
    - parent_event_id
    - causation_id
    - decision_id
    - governance_decision_id
    - execution_id
    - artifact_id
    - scope
    - payload
    - idempotency_key
    obrigatorios_para_rastreabilidade:
    - contract_id
    - contract_version
    - artifact_id
    campos_descartados_silenciosamente:
    - nome: contract
      emitido_por: archimedes
      observacao: '[CODIGO] Nao existe no schema; Pydantic descarta sem erro. A coluna `contract` EXISTE
        na tabela e e lida por quem entra via SQL direto. Dado visivel por um caminho e invisivel por
        outro.

        '
    - nome: meta
      emitido_por: juridicotech
    - nome: signature
      emitido_por: juridicotech
      observacao: '[CODIGO] valor literal ''sha256'' — nome do algoritmo, nao assinatura'
    versao: ESTADO REAL DO CORE — nao alterado por esta campanha
    nota: campos de autoridade sao PERSISTIDOS mas NAO aceitos do payload — derivados da identidade autenticada
      e do control plane
    ATENCAO: esta chave descreve o que o CORE ACEITA HOJE. Nao e requisito.
    verificado_em: cv-backend-core/app/main.py:617 FederationEventPublishRequest
  contract_version_policy:
    procedencia: '[DECIDIDO 2026-08-29]'
    formato: SemVer estrito MAJOR.MINOR.PATCH
    identidade_do_contrato: (contract_id, contract_version)
    queryable: true
    validos:
    - 1.0.0
    - 1.1.0
    - 2.0.0
    invalidos:
    - v1
    - '1.0'
    - latest
    - null
    - ''
    regex: ^\d+\.\d+\.\d+$
    justificativa: contract_version filtravel e indispensavel para replay historico
    acao_no_servidor: tornar contract_version filtravel em _filter_federation_events
  canonical_producer_ids:
    procedencia: '[DECIDIDO 2026-08-29]'
    principio: ID tecnico imutavel, independente de nome comercial e de geografia
    registro:
      core:
        producer_id: liceu.core
        display_name: LICEU CORE
      archimedes:
        producer_id: liceu.archimedes
        display_name: ARCHIMEDES
      cefeida:
        producer_id: liceu.cefeida
        display_name: CEFEIDA
      john:
        producer_id: liceu.john
        display_name: JOHN BRASILEIRO
      anchor:
        producer_id: liceu.anchor
        display_name: ANCHOR
      opera:
        producer_id: liceu.opera
        display_name: OPERA
      bim:
        producer_id: liceu.bim
        display_name: BIM.ARQ.ENG
      fornecedores:
        producer_id: liceu.suppliers
        display_name: FORNECEDORES
      econotech:
        producer_id: liceu.econotech
        display_name: ECONOTECH
      cea:
        producer_id: liceu.cea
        display_name: CEA INVESTIMENTOS
      juridicotech:
        producer_id: liceu.legal
        display_name: JURIDICOTECH
      gamemkt:
        producer_id: liceu.market
        display_name: GAME MKT
      hub:
        producer_id: liceu.hub
        display_name: HUB BACKOFFICE
      academia:
        producer_id: liceu.academy
        display_name: ACADEMIA DO SABER
      ped:
        producer_id: liceu.research
        display_name: P&D.IA
      mandate:
        producer_id: liceu.mandate
        display_name: MANDATO
    separar_de:
    - canonical_id
    - display_name
    - repository
    - aliases
    - instance_id
    - federation_id
    regra_de_escala:
      proibido:
      - earth.archimedes
      - mars.archimedes
      correto: producer_id permanece liceu.archimedes; a localizacao vive em federation_id / node_id /
        scope / territorial_context
      razao: o dominio nao muda com o corpo celeste; a identidade federativa e independente da geografia
  transport_policy:
    procedencia: '[DECIDIDO 2026-08-29]'
    decisao: ambos, com funcoes constitucionais distintas
    http:
      papel: synchronous federation boundary
      usos:
      - query
      - command
      - validation
      - resolution
      - health
      - authentication
    nats_jetstream:
      papel: asynchronous event fabric
      usos:
      - facts
      - state transitions
      - fan-out
      - subscriptions
      - durable propagation
    ambos_devem_usar:
    - same producer identity
    - same canonical contracts
    - same lineage semantics
    - same trace context
    - same Federation Envelope
    proibido: DIRECT CROSS-DOMAIN SQL
    acao: convergir os 6 streams NATS para namespace comum sob a mesma identidade de produtor
    semantica_de_evento:
      principio: ONE CANONICAL EVENT — dois caminhos, nunca dois fatos
      http: registro/publicacao no Event Store canonico (boundary sincrono)
      jetstream: propagacao durable assincrona do MESMO fato
      invariante: event_id, envelope_fingerprint e lineage identicos nos dois caminhos
      nao_significa: 'transport: [http, nats] NAO obriga publicar duas vezes nem cria dois eventos independentes'
    formato_por_evento: transport.canonical_publish + transport.asynchronous_propagation. O formato de
      lista [http, nats] induzia a pensar que ambos sao publicacoes obrigatorias e independentes. Sao
      papeis distintos sobre O MESMO fato.
  authority_model:
    procedencia: '[DOC][CERT]'
    principio: EVIDENCE != RECOMMENDATION != AUTHORIZATION != EXECUTION != OBSERVATION != LEARNING
    referencia_implementada: '[CERT] archimedes W89B3 Authority Kernel'
    estados_formais:
    - DRAFT
    - OBSERVATION
    - ANALYSIS
    - RECOMMENDATION
    - VALIDATED
    - AUTHORITATIVE
    - AUTHORITATIVE_OUTPUT
    - SUPERSEDED
    - REJECTED
    observacao: '[CODIGO] Implementado em 1 de 15 monolitos. Nos outros 14 a separacao e documento, nao
      codigo.

      '
  security_model:
    procedencia: '[CERT][CODIGO]'
    auth_event_store: X-Canonical-Service-Secret
    auth_core_dna: 'Authorization: Bearer <JWT>'
    regra_absoluta: '[CERT] JWT_SECRET_KEY nunca sai do CORE'
    nunca_confundir:
    - CANONICAL_EVENT_STORE_API_SECRET NAO e Bearer do CORE-DNA
    - ARCHIMEDES_CORE_DNA_CLIENT_SECRET NAO e Bearer de runtime
    variaveis_canonicas:
    - CANONICAL_EVENT_STORE_API_URL
    - CANONICAL_EVENT_STORE_API_SECRET
    aliases_proibidos:
      procedencia: '[CODIGO]'
      lista:
      - FEDERATION_API_URL
      - CANONICAL_SERVICE_SECRET
      observacao: ARCHIMEDES aceita estes; nenhum outro monolito reconhece
  antipadroes:
    antipadrao_1_db_coupling:
      severidade: CRITICO
      regra: Nenhum monolito acessa banco/estado interno de outro
      deteccao: liceu_core_os | FROM public.events fora do CORE
      violacao_conhecida: '[CODIGO] bim/runtime/bim_arch_eng/wave89a_canonical_resolution_gate.py'
    antipadrao_2_valor_inventado:
      severidade: CRITICO
      regra: dado ausente -> BLOCKED. Nunca inventar valor e seguir o pipeline
      padrao_correto: missing input -> BLOCKED -> identificar produtor -> request formal -> retomar
      deteccao: marcador de mock JUNTO COM I/O comentado
      violacao_conhecida: '[CODIGO] core/runtime/persistence/event_store_pg.py — psycopg2 e todos os cur.execute
        comentados; append_event loga sucesso e nao persiste; get_events retorna []. Indistinguivel de
        "agregado nao existe".

        '
      nota_de_escopo: 'O caminho canonico REAL (cv-backend-core/app/main.py) grava em Postgres e funciona
        [CERT]. Este arquivo esta na arvore paralela runtime/. PRE-REQUISITO P0: verificar quem o importa.

        '
    antipadrao_3_fallback_silencioso:
      severidade: ALTO
      regra: Faltando credencial/URL canonica -> falhar fechado, nunca default
      referencia_correta: '[CODIGO] fornecedores/backend/app/services/canonical_federation_client.py (ValueError
        nos 4 metodos)'
  principios_constitucionais:
    procedencia: '[DECIDIDO 2026-08-29]'
    P01: ONE AUTHORITATIVE STATE -> ONE DOMAIN OWNER
    P02: PROJECTION != OWNERSHIP
    P03: AI OUTPUT != AUTHORITATIVE FACT
    P04: MISSING AUTHORITATIVE INPUT -> BLOCKED
    P05: EXPERIMENT != PRODUCTION TRUTH
    P06: NO CROSS-DOMAIN DATABASE ACCESS
    P07: EVIDENCE != RECOMMENDATION != AUTHORIZATION != EXECUTION != OBSERVATION != LEARNING
    P08: NO CHAIN WITHOUT HUMAN MANDATE
    nota_P08: '[DECIDIDO 2026-09-18] A cadeia causal nasce de um pedido com mandato humano (posicao 0,
      liceu.mandate), com prova humana forte no proprio fato. Nenhum sistema — JOHN, HUB, ARCHIMEDES —
      origina um pedido de planejamento: se um sistema o emitisse, a cadeia inteira nasceria de IA (P03).
      O ARCHIMEDES continua podendo ESTUDAR por iniciativa propria (may_decide), mas o que entra na cadeia
      minima e o estudo que responde a um mandato.'
  politica_de_severidade:
    procedencia: '[DECIDIDO 2026-08-29]'
    development: CRITICO
    pull_request: ALTO
    certification: MEDIO
  scope_model:
    procedencia: '[DECIDIDO 2026-08-29]'
    principio: generalizacao nos primitives, nao em features de Marte
    hierarquia:
    - federation_id
    - civilization_id
    - planetary_system_id
    - celestial_body_id
    - region_id
    - territory_id
    - site_id
    - asset_id
    separar: territory != jurisdiction
    temporalidade:
    - observed_at
    - valid_from
    - valid_until
    - effective_at
    - supersedes
  event_ownership:
    procedencia: '[DECIDIDO 2026-08-29]'
    principio: O checker nao adivinha autoridade pelo nome do evento. A Constituicao declara. Producao
      por classe de autoridade nao autorizada e AUTHORITY_VIOLATION (CRITICO).
    regra_de_instancia: allowed_producers lista CLASSES de autoridade (producer_id). Multiplas INSTANCIAS
      da mesma classe sao permitidas — necessario para o modelo global/interplanetario.
    mandate.planning.requested:
      authoritative_owner: liceu.mandate
      allowed_producers:
      - liceu.mandate
      lifecycle: PLANNED
      transport:
        canonical_publish: http
        asynchronous_propagation: nats_jetstream
      nota: posicao 0 — precede a cadeia minima; o elo 1 o referencia por causation_id
    archimedes.planning.state.authoritative:
      authoritative_owner: liceu.archimedes
      allowed_producers:
      - liceu.archimedes
      lifecycle: PLANNED
      transport:
        canonical_publish: http
        asynchronous_propagation: nats_jetstream
    cefeida.evidence.published:
      authoritative_owner: liceu.cefeida
      allowed_producers:
      - liceu.cefeida
      lifecycle: PLANNED
      transport:
        canonical_publish: http
        asynchronous_propagation: nats_jetstream
    john.recommendation.generated:
      authoritative_owner: liceu.john
      allowed_producers:
      - liceu.john
      lifecycle: PLANNED
      transport:
        canonical_publish: http
        asynchronous_propagation: nats_jetstream
    anchor.authorization.granted:
      authoritative_owner: liceu.anchor
      allowed_producers:
      - liceu.anchor
      lifecycle: PLANNED
      transport:
        canonical_publish: http
        asynchronous_propagation: nats_jetstream
    opera.execution.created:
      authoritative_owner: liceu.opera
      allowed_producers:
      - liceu.opera
      lifecycle: PLANNED
      transport:
        canonical_publish: http
        asynchronous_propagation: nats_jetstream
    john.decision.made:
      authoritative_owner: liceu.john
      allowed_producers:
      - liceu.john
      lifecycle: ACTIVE
      nota: grafo detectou producao por bim e cefeida — nenhum tem may_decide
      transport:
        canonical_publish: null
        asynchronous_propagation: nats_jetstream
    john.finance.decision:
      authoritative_owner: liceu.john
      allowed_producers:
      - liceu.john
      lifecycle: ACTIVE
      transport:
        canonical_publish: null
        asynchronous_propagation: nats_jetstream
    contract.created:
      authoritative_owner: liceu.legal
      allowed_producers:
      - liceu.legal
      lifecycle: DEPRECATED
      nota: 'namespace ambiguo: core=schema contract, legal=acordo, hub=projecao. Migrar para core.contract.registered
        / legal.contract.created / hub.projection.updated'
      transport:
        canonical_publish: null
        asynchronous_propagation: nats_jetstream
    contract.signed:
      authoritative_owner: liceu.legal
      allowed_producers:
      - liceu.legal
      lifecycle: DEPRECATED
      transport:
        canonical_publish: null
        asynchronous_propagation: nats_jetstream
    hub.budget.approved:
      authoritative_owner: liceu.cea
      allowed_producers:
      - liceu.cea
      lifecycle: DEPRECATED
      nota: HUB nao e autoridade financeira. Consumidores (archimedes, gamemkt) esperam autoridade que
        constitucionalmente nao existe. Renomear para cea.budget.approved e migrar consumidores.
      transport:
        canonical_publish: null
        asynchronous_propagation: nats_jetstream
    hub.budget.limit:
      authoritative_owner: liceu.cea
      allowed_producers:
      - liceu.cea
      lifecycle: DEPRECATED
      transport:
        canonical_publish: null
        asynchronous_propagation: nats_jetstream
  event_namespace_policy:
    procedencia: '[DECIDIDO 2026-08-29]'
    principio: 'Namespace comum nao basta: a taxonomia deve PRESERVAR AUTORIDADE'
    formato: <authority>.<aggregate>.<fact>
    exemplos_corretos:
    - core.contract.registered
    - legal.contract.created
    - legal.contract.signed
    - hub.projection.updated
    - cea.budget.approved
    antipadrao: contract.created — nao revela qual autoridade produziu
  event_classification_taxonomy:
    procedencia: '[DECIDIDO 2026-08-29]'
    fase: P2.5 — Event Graph Reconciliation
    valores:
    - AUTHORITATIVE_EVENT
    - DOMAIN_EVENT
    - COMMAND
    - QUERY
    - PROJECTION_EVENT
    - INTERNAL_EVENT
    - CERTIFICATION_EVENT
    - LEGACY
    - DEPRECATED
    - DEAD_CODE
    - FALSE_POSITIVE
    - FUTURE_CONTRACT
    criterio_de_milestone: UNCLASSIFIED_ORPHAN_EVENTS=0 (nunca ORPHAN_EVENTS=0)
    nota_certification_event: Waves, gates e artifacts de certificacao nao sao INTERNAL_EVENT. Separar
      BUSINESS/DOMAIN HISTORY de CERTIFICATION HISTORY sem apagar lineage.
  internal_reference_implementations:
    procedencia: '[DECIDIDO 2026-08-29]'
    regra: Para quase toda pratica ruim disseminada existe um monolito que ja resolveu. Extrair o INVARIANTE,
      nunca copiar o codigo nem a divida incidental do repositorio de origem.
    referencias:
      fail_closed:
        invariante: configuracao federativa ausente -> erro explicito
        referencia: liceu.suppliers
        aplica_a: 9 monolitos com fallback silencioso
      envelope_canonico:
        invariante: contract_id + contract_version + artifact_id
        referencia: liceu.john
        aplica_a: os outros 14
      authority_boundary:
