          human_actor_id:
            type: string
            description: PSEUDONIMIZADO
          decision_dossier_id:
            type: string
          problema_que_provocou_o_escalonamento:
            type: string
          capability:
            type: string
          teto_ultrapassado:
            type: string
          maes_indisponiveis:
            type: array
            items:
              type: string
            minItems: 1
          evidencias_consideradas:
            type: array
            items:
              type: string
            minItems: 1
          alternativas:
            type: array
            minItems: 1
          risco_avaliado:
            type: string
          decisao:
            type: string
          justificativa:
            type: string
          autenticacao:
            type: object
            description: evidencia de autenticacao forte
          external_effect:
            type: boolean
          supersedes:
            type: string
      authority_invariants:
      - so liceu.authority produz este fato; nenhum monolito pode emiti-lo
      - o humano NAO escreve no banco e NAO entra por rota paralela ao protocolo
      - a execucao so continua depois que o evento for validado pelo Event Store
      - human_actor_id deve ser PSEUDONIMIZADO
      domain_invariants:
      - maes_indisponiveis nao pode ser vazio — o evento so existe em contingencia
      - evidencias_consideradas nao pode ser vazio — decisao sem evidencia e proibida
      - alternativas nao pode ser vazio
      - 'causation_id obrigatorio: a decisao humana tem origem causal'
      motivo: 'aceitava autenticacao vazia. RETIRED: nao aceita publicacao nova; leitura de evento historico
        permanece valida.'
    2.0.0:
      contract_id: liceu.authority.human-decision
      contract_version: 2.0.0
      status: ACTIVE
      owner: liceu.authority
      allowed_producers:
      - liceu.authority
      event_type: authority.human.decision.recorded
      posicao_na_cadeia: null
      proposito: registrar decisao humana de contingencia como fato canonico com lineage. O humano nao
        escreve no banco nem entra por rota paralela.
      required_envelope_fields:
      - event_id
      - producer_id
      - producer_instance_id
      - contract_id
      - contract_version
      - trace_id
      - causation_id
      - source_event_id
      - authority_epoch
      - scale
      - payload_hash
      - envelope_fingerprint
      - observed_at
      - emitted_at
      - authority_role
      - authority_issuer_id
      - activation_certificate_id
      forbidden_envelope_fields: {}
      payload_schema:
        type: object
        required:
        - decision_id
        - human_actor_id
        - decision_dossier_id
        - escalation_reason
        - capability
        - evidencias_consideradas
        - alternativas
        - risco_avaliado
        - decisao
        - justificativa
        - external_effect
        - reversibility
        - human_signature
        - human_authentication_method
        - mfa_assertion_hash
        - signed_at
        - nonce
        - witness_attestation
        properties:
          decision_id:
            type: string
          human_actor_id:
            type: string
            description: PSEUDONIMIZADO
          decision_dossier_id:
            type: string
          problema_que_provocou_o_escalonamento:
            type: string
          capability:
            type: string
          teto_ultrapassado:
            type: string
          maes_indisponiveis:
            type: array
            items:
              type: string
            condicional: obrigatorio SOMENTE quando escalation_reason == MOTHERS_UNAVAILABLE
          evidencias_consideradas:
            type: array
            items:
              type: string
            minItems: 1
          alternativas:
            type: array
            minItems: 1
          risco_avaliado:
            type: string
          decisao:
            type: string
          justificativa:
            type: string
          external_effect:
            type: boolean
          supersedes:
            type: string
          escalation_reason:
            type: string
            enum:
            - MOTHERS_UNAVAILABLE
            - UNRESOLVED_CONFLICT
            - INSUFFICIENT_EVIDENCE
            - CONSTITUTIONAL_RISK_LIMIT
            - MANUAL_EMERGENCY
          human_signature:
            type: string
            minLength: 64
            description: assinatura criptografica do humano sobre o dossie
          human_authentication_method:
            type: string
            enum:
            - MFA_TOTP
            - MFA_FIDO2
            - MFA_HARDWARE_KEY
            - PKI_SMARTCARD
          mfa_assertion_hash:
            type: string
            minLength: 64
            maxLength: 128
          signed_at:
            type: string
            description: ISO 8601
          nonce:
            type: string
            minLength: 16
            description: anti-replay da assinatura
          witness_attestation:
            type: object
            required:
            - witness_instance_id
            - verified_signature
            - verified_at
            description: a testemunha ATESTA que verificou; nao cria a decisao
          reversibility:
            type: string
            enum:
            - REVERSIVEL
            - IRREVERSIVEL
            - PARCIAL
      authority_invariants:
      - so liceu.authority produz este fato; nenhum monolito pode emiti-lo
      - o humano NAO escreve no banco e NAO entra por rota paralela ao protocolo
      - a execucao so continua depois que o evento for validado pelo Event Store
      - human_actor_id deve ser PSEUDONIMIZADO
      - a TESTEMUNHA pode REGISTRAR a decisao humana apos verificar assinatura e autenticacao. NAO pode
        CRIA-LA — human_signature e mfa_assertion_hash sao obrigatorios e nao podem ser vazios.
      - authority_role, authority_issuer_id e activation_certificate_id vem da identidade autenticada,
        NUNCA do payload
      domain_invariants:
      - escalation_reason obrigatorio — o motivo do escalonamento e parte do fato
      - maes_indisponiveis obrigatorio SOMENTE se escalation_reason == MOTHERS_UNAVAILABLE; nos demais
        casos as Maes podem estar disponiveis
      - evidencias_consideradas nao pode ser vazio — decisao sem evidencia e proibida
      - alternativas nao pode ser vazio
      - 'causation_id obrigatorio: a decisao humana tem origem causal'
      - human_signature com menos de 64 caracteres e invalida
      - witness_attestation deve nomear a instancia que verificou
      natureza: RAMIFICACAO_DE_CONTINGENCIA
      NAO_E_ELO_DA_CADEIA_NORMAL: entra ANTES da autorizacao final e da execucao, somente quando a contingencia
        ocorre
      CORRECAO_DE_DESENHO:
        erro: authority_role, issuer e certificate estavam no payload_schema required
        por_que_estava_errado: a Constituicao 1.14.0 diz que esses campos vem da IDENTIDADE AUTENTICADA,
          nunca do payload. Exigi-los no payload permitiria ao produtor declarar o proprio papel.
        correcao: movidos para required_envelope_fields
      changelog_2_0_0: 'MAJOR: acrescenta 9 campos OBRIGATORIOS de autenticacao humana forte. Consumidor
        de 1.0.0 NAO satisfaz este contrato. Renumerado de 1.1.0 para 2.0.0 — acrescentar campo OPCIONAL
        e MINOR; acrescentar OBRIGATORIO e MAJOR.'
  liceu.legal.admissibility:
    1.0.0:
      contract_version: 1.0.0
      event_type: legal.admissibility.assessed
      classification: AUTHORITATIVE_EVENT
      posicao_na_cadeia: null
      natureza: PARECER_TRANSVERSAL
      owner: liceu.legal
      allowed_producers:
      - liceu.legal
      required_envelope_fields:
      - artifact_id
      - trace_id
      - causation_id
      forbidden_envelope_fields:
        decision_id: JURIDICOTECH avalia admissibilidade; nao decide (liceu.john)
        governance_decision_id: JURIDICOTECH nao autoriza o ato avaliado (liceu.anchor). A capacidade
          aprovacao_juridica_no_proprio_dominio e sobre o PARECER, nao sobre o ato.
        execution_id: JURIDICOTECH nao executa (liceu.opera)
      authority_invariants:
      - o parecer e SOBRE subject_ref e nunca sobre si mesmo (subject_ref.event_id != event_id)
      - causation_id aponta para o fato avaliado ou para o pedido de parecer; nunca para este evento
      - scale do parecer <= liceu.legal.scale_max (REGIONAL no Producer Registry); acima disso o parecer
        nao existe — o consumidor deriva UNCOVERED por construcao, nunca COVERED por omissao (P04)
      - parecer nao e eterno; assessed_at obrigatorio. Quem consome decide a validade pela vigencia das
        normas citadas (legal_basis_refs[].valid_until), nunca por prazo implicito
      - legal_coverage e AFIRMACAO do liceu.legal; e o unico produtor que pode afirma-la. Qualquer outro
        produtor so REFERENCIA este fato (anchor.authorization.legal_basis_refs)
      domain_invariants:
      - COVERED_WITH_CONDITIONS exige conditions nao vazio — codificado no schema (if/then), nao em prosa.
        Condicional sem condicoes e aprovacao disfarcada de cautela
      - conditions so existe com COVERED_WITH_CONDITIONS — schema
      - COVERED e COVERED_WITH_CONDITIONS exigem legal_basis_refs nao vazio; NOT_APPLICABLE nao pode ter
        legal_basis_refs — schema
      - a norma de referencia e a VIGENTE NA DATA DO FATO, nao a de hoje. Cada legal_basis_ref cita norma,
        artigo e versao com valid_from/valid_until; G5 exige valid_from <= subject_ref.occurred_at <=
        valid_until
      - assessed_at >= subject_ref.occurred_at — parecer nao antecede o fato (G5)
      - jurisdiction_id obrigatorio — sem jurisdicao nao ha direito aplicavel
      - scale no payload; se o envelope tambem carregar scale, os dois tem de coincidir (G5)
      payload_schema:
        type: object
        required:
        - legal_coverage
        - subject_ref
        - jurisdiction_id
        - scale
        - assessed_at
        additionalProperties: false
        properties:
          legal_coverage:
            type: string
            enum:
            - COVERED
            - COVERED_WITH_CONDITIONS
            - UNCOVERED
            - NOT_APPLICABLE
          subject_ref:
            type: object
            description: o fato ou ato avaliado — versao exata, com a data em que ocorreu
            required:
            - event_id
            - content_hash
            - occurred_at
            additionalProperties: false
            properties:
              event_id:
                type: string
                minLength: 3
              content_hash:
                type: string
                minLength: 32
              occurred_at:
                type: string
                format: date-time
          jurisdiction_id:
            type: string
            minLength: 2
            description: 'ex.: BR, BR-SP, BR-SP-3550308 (ISO 3166 + IBGE quando municipal)'
          scale:
            type: string
            enum:
            - LOCAL
            - REGIONAL
            - CONTINENTAL
            - GLOBAL
            - CIVILIZACIONAL
            - INTERPLANETARIA
          assessed_at:
            type: string
            format: date-time
          conditions:
            type: array
            items:
              type: object
              required:
              - condition_id
              - description
              additionalProperties: false
              properties:
                condition_id:
                  type: string
                  minLength: 1
                description:
                  type: string
                  minLength: 1
                verifiable_by:
                  type: string
                  description: quem consegue verificar o cumprimento (producer_id ou papel)
          legal_basis_refs:
            type: array
            items:
              type: object
              required:
              - norm
              - article
              - version
              - valid_from
              additionalProperties: false
              properties:
                norm:
                  type: string
                  minLength: 1
                article:
                  type: string
                  minLength: 1
                version:
                  type: string
                  minLength: 1
                  description: 'identificacao da redacao vigente (ex.: redacao dada pela Lei 14.133/2021)'
                valid_from:
                  type: string
                  format: date
                valid_until:
                  type:
                  - string
                  - 'null'
                  format: date
                source_uri:
                  type: string
          reasoning:
            type: string
        allOf:
        - if:
            properties:
              legal_coverage:
                const: COVERED_WITH_CONDITIONS
          then:
            required:
            - conditions
            properties:
              conditions:
                minItems: 1
          else:
            properties:
              conditions:
                maxItems: 0
        - if:
            properties:
              legal_coverage:
                enum:
                - COVERED
                - COVERED_WITH_CONDITIONS
          then:
            required:
            - legal_basis_refs
            properties:
              legal_basis_refs:
                minItems: 1
        - if:
            properties:
              legal_coverage:
                const: NOT_APPLICABLE
          then:
            properties:
              legal_basis_refs:
                maxItems: 0
      status: ACTIVE
  liceu.hub.planning-request:
    1.0.0:
      contract_version: 1.0.0
      event_type: hub.planning.requested
      classification: AUTHORITATIVE_EVENT
      posicao_na_cadeia: null
      precede_elo: 1
      natureza: FATO_DE_INTERACAO
      owner: liceu.hub
      allowed_producers:
      - liceu.hub
      required_envelope_fields:
      - artifact_id
      - trace_id
      forbidden_envelope_fields:
        causation_id: 'o pedido e RAIZ da cadeia — nada o causou dentro do ecossistema; quem o origina esta
          em mandate_ref, nao em lineage'
        decision_id: o HUB registra o pedido; nao decide o que estudar (liceu.john nao origina — P03)
        governance_decision_id: o HUB nao autoriza (liceu.anchor / liceu.authority)
        execution_id: o HUB nao executa (liceu.opera)
      authority_invariants:
      - a interacao e fato proprio do HUB; o CONTEUDO pedido nao e — o HUB nao afirma onde nem por que
        atuar, so que foi pedido, por quem, com que mandato e ate que alcance
      - mandate_ref e obrigatorio — sem ele o HUB registra pedido anonimo e o ARCHIMEDES estuda sob
        demanda sem origem. holder_id e a identidade do requerente conforme o HUB a autenticou; o HUB
        e a porta unica de atendimento (JOHN_triagem = HUB)
      - o HUB nao e liceu.john — o pedido nunca vem de sintese cognitiva; se a origem for uma
        recomendacao, ela e referenciada em source_recommendation_ref e o requerente humano continua
        sendo quem pede
      - scale do pedido <= scale_max de liceu.hub (INTERPLANETARIA) — mandato de alcance; nao e alcada
      - 'o elo 1 (archimedes.planning-state) consome este fato: payload.planning_request_id do elo 1 ==
        payload.planning_request_id deste evento, e causation_id do elo 1 aponta para este event_id'
      domain_invariants:
      - 'mandato VIGENTE na data do pedido — mandate_ref.valid_from <= requested_at <= valid_until (G5).
        Pedido sob mandato expirado nao e pedido'
      - planning_request_id e deterministico por (holder_id, requested_at, requested_scope) — dois
        pedidos iguais sao um pedido
      - problem_statement nao vazio — pedido sem problema e demanda sem origem
      - 'requested_scope.territorial_scope no enum do elo 1 (SITE..PLANETARY): o HUB pede no vocabulario
        de quem vai estudar'
      payload_schema:
        type: object
        required:
        - planning_request_id
        - mandate_ref
        - requested_scope
        - problem_statement
        - requested_at
        - scale
        additionalProperties: false
        properties:
          planning_request_id:
            type: string
            minLength: 1
          mandate_ref:
            type: object
            description: quem pediu e sob que mandato — a origem humana do pedido
            required:
            - mandate_id
            - holder_id
            - holder_kind
            - valid_from
            additionalProperties: false
            properties:
              mandate_id:
                type: string
                minLength: 1
              holder_id:
                type: string
                minLength: 1
                description: identidade do requerente conforme autenticada pelo HUB
              holder_kind:
                type: string
                enum:
                - HUMAN
                - ORGANIZATION
              granted_by:
                type: string
                description: quem conferiu o mandato (orgao, contrato, ato)
              valid_from:
                type: string
                format: date
              valid_until:
                type:
                - string
                - 'null'
                format: date
              evidence_uri:
                type: string
          requested_scope:
            type: object
            required:
            - territorial_scope
            additionalProperties: false
            properties:
              territorial_scope:
                type: string
                enum:
                - SITE
                - REGION
                - TERRITORY
                - CONTINENTAL
                - PLANETARY
              jurisdiction_id:
                type: string
                minLength: 2
              geometry_ref:
                type: string
                description: referencia a geometria (artifact_id ou URI), nunca a geometria inline
              crs:
                type: string
          problem_statement:
            type: string
            minLength: 10
          objectives:
            type: array
            items:
              type: string
              minLength: 1
          constraints:
            type: array
            items:
              type: string
              minLength: 1
          source_recommendation_ref:
            type:
            - string
            - 'null'
            description: event_id de john.recommendation.generated se o pedido nasceu de uma recomendacao;
              o requerente humano continua sendo quem pede
          requested_at:
            type: string
            format: date-time
          scale:
            type: string
            enum:
            - LOCAL
            - REGIONAL
            - CONTINENTAL
            - GLOBAL
            - CIVILIZACIONAL
            - INTERPLANETARIA
      status: ACTIVE
lineage_chain:
  descricao: 'Lida na vertical, esta tabela e a separacao de autoridade tornada verificavel. Nenhum produtor
    consegue emitir um campo de etapa que nao lhe pertence, entao a cadeia nao pode ser fabricada de tras
    para frente.

    '
  tabela:
  - elo: 1
    produtor: liceu.archimedes
    emite:
    - artifact_id
    - trace_id
    proibido:
    - decision_id
    - governance_decision_id
    - execution_id
  - elo: 2
    produtor: liceu.cefeida
    emite:
    - artifact_id
    - trace_id
    - observed_at
    proibido:
    - decision_id
    - governance_decision_id
    - execution_id
  - elo: 3
    produtor: liceu.john
    emite:
    - causation_id
    - decision_id
    proibido:
    - governance_decision_id
    - execution_id
  - elo: 4
    produtor: liceu.anchor
    emite:
    - governance_decision_id
    proibido:
    - execution_id
  - elo: 5
    produtor: liceu.opera
    emite:
    - execution_id
    proibido:
    - decision_id
