meta:
  artifact: LICEU_CONTRACT_REGISTRY
  registry_version: 2.5.0
  fase: P2.1
  data: '2026-08-29'
  constitution_version: 1.15.0
  escopo: pedido de planejamento (1) + cadeia causal minima (5) + extensao CEA (2) + decisao humana (1)
    + admissibilidade juridica (1) = 10 contract_ids
  status: DEFINIDO — 0/7 implementados. Os 2 do CEA substituem wave83/wave92 e NAO foram aplicados ao
    codigo.
  regra: 'Contrato definido nao e contrato implementado. A promocao para implementado exige conformance
    test passando contra produtor real.

    '
  constitution_sha256: 92a9dc9e47243cfc9e50a278e6de8e39fac1a93668a748daeba866ddf7e5d332
  constitution_compatibility: 'compativel com 1.12.0: fronteira do ANCHOR precisada, envelope atribuido
    ao CORE, camadas transversais e core_dna acrescentados. Nenhuma capacidade, teto ou contrato alterado.'
  nota_extensao_cea: 'DOIS contratos, nao um: wave83 e planetario e raiz; wave92 e continental e DERIVA
    de outro fato. Cardinalidade e lineage diferentes — um contrato so obrigaria campos opcionais e enfraqueceria
    a validacao. NOMENCLATURA: o codigo usa campo `decision` com valores fund/review. A Constituicao da
    ao CEA may_decide=[estrutura_de_capital, viabilidade_financeira], entao decidir viabilidade e legitimo;
    mas `fund` soa autorizacao, que o CEA NAO tem (may_authorize=[]). O contrato nomeia `financial_viability`
    com enum explicito para que ninguem leia aprovacao de funding onde ha avaliacao.'
  nota_legal_coverage: 'liceu.anchor.authorization 1.1.0 acrescenta legal_basis_refs. O campo e OPCIONAL
    por decisao: exigir forcaria preenchimento, e preenchimento sob pressao produz referencia inventada.
    Ausencia honesta e melhor que referencia falsa.'
  indexacao: contract_id -> contract_version -> definicao
  changelog_2_5_0: 'MINOR (decisao B2, 2026-09-19): acrescenta liceu.hub.planning-request 1.0.0 — o
    pedido de planejamento territorial que o elo 1 exigia (planning_request_id) sem que ninguem o
    emitisse. Quem emite e o HUB, como FATO DE INTERACAO: o HUB nao possui o territorio nem decide o
    que estudar, mas possui o fato de que alguem, identificado e com mandato (mandate_ref), pediu — e
    ja e a porta unica de atendimento. Alternativas consideradas e descartadas: JOHN central (P03 —
    a IA originaria o que o ecossistema estuda, e sintetizaria a resposta ao proprio pedido); humano
    direto (individuo nao e produtor; origina, mas precisa de quem registre); liceu.mandate (novo
    plano, posicao 0, P08, Constituicao 1.16.0 — certo se mandato originar outras coisas alem de
    planejar; hoje nenhum produtor declara isso, e seria um produtor com um contrato so). A opcao
    HUB se desfaz com DEPRECATED; a alternativa exigiria desfazer uma versao constitucional.
    Constituicao 1.15.0 INTOCADA. Nenhum contrato existente alterado. Corrige contagem (estava 8/10
    desde 2.3.0).'
  changelog_2_4_0: 'MINOR: acrescenta liceu.legal.admissibility 1.0.0 (produtor liceu.legal ja existia
    no Producer Registry sem contrato pelo qual publicar — CORE #32). Nenhum contrato existente
    alterado. Da insumo ao invariante de legal_coverage do anchor.authorization 1.1.0 (CORE #33).'
  changelog_2_0_0: 'MAJOR: reestruturacao de indexacao. Antes contract_id -> UMA definicao; agora contract_id
    -> contract_version -> definicao. Necessario porque a Constituicao define identidade = (contract_id,
    contract_version) e o registry anterior nao conseguia servir duas versoes ao mesmo tempo — bump de
    versao apagava a anterior.'
  status_semantica:
    ACTIVE: aceita publicacao nova; valida leitura
    DEPRECATED: aceita publicacao nova COM aviso; valida leitura; migrar
    RETIRED: REJEITA publicacao nova; AINDA valida leitura
    REGRA: aposentadoria bloqueia ESCRITA, nunca LEITURA. Se RETIRED bloqueasse leitura, eventos historicos
      deixariam de validar e a historia se tornaria irreconstruivel.
  contagem:
    contract_ids: 10
    versoes: 12
  nota_ramificacao: 'liceu.authority.human-decision NAO tem posicao_na_cadeia: e ramificacao de contingencia,
    nao elo sequencial'
compatibility_policy:
  versionamento: SemVer estrito MAJOR.MINOR.PATCH
  identidade: (contract_id, contract_version)
  PATCH: correcao sem mudanca de schema
  MINOR: campo opcional adicionado; consumidores antigos continuam validos
  MAJOR: campo obrigatorio adicionado/removido, ou tipo alterado
  regra_de_ouro: nunca quebrar contrato silenciosamente
  deprecacao: MAJOR anterior permanece resolvivel para replay historico
envelope_baseline:
  sempre_obrigatorios:
  - event_id
  - event_type
  - producer_id
  - contract_id
  - contract_version
  - trace_id
  - artifact_id
  - scope
  - payload
  - payload_hash
  - envelope_fingerprint
  - emitted_at
  nota: 'observed_at e obrigatorio apenas para fatos observacionais (CEFEIDA). causation_id e obrigatorio
    a partir do 2o elo da cadeia.

    '
contracts:
  liceu.archimedes.planning-state:
    1.0.0:
      contract_version: 1.0.0
      event_type: archimedes.planning.state.authoritative
      classification: AUTHORITATIVE_EVENT
      posicao_na_cadeia: 1
      owner: liceu.archimedes
      allowed_producers:
      - liceu.archimedes
      required_envelope_fields:
      - artifact_id
      - trace_id
      forbidden_envelope_fields:
        decision_id: ARCHIMEDES nao decide — decisao cognitiva e do liceu.john
        governance_decision_id: ARCHIMEDES nao autoriza — autorizacao e do liceu.anchor
        execution_id: ARCHIMEDES nao executa — execucao e do liceu.opera
      authority_invariants:
      - produz alternativa territorial, nunca escolha autorizada
      - estado deve estar em AUTHORITATIVE ou AUTHORITATIVE_OUTPUT do Authority Kernel
      - WHERE_TO_BUILD e WHY_TO_BUILD sao justificativas, nao aprovacoes
      domain_invariants:
      - candidates nao vazio quando state_status = AUTHORITATIVE_OUTPUT
      - cada candidate tem why (justificativa rastreavel a evidencia)
      - crs obrigatorio quando ha geometria
      payload_schema:
        type: object
        required:
        - planning_request_id
        - state_status
        - territorial_scope
        - candidates
        additionalProperties: false
        properties:
          planning_request_id:
            type: string
            minLength: 1
          state_status:
            type: string
            enum:
            - DRAFT
            - OBSERVATION
            - ANALYSIS
            - RECOMMENDATION
            - VALIDATED
            - AUTHORITATIVE
            - AUTHORITATIVE_OUTPUT
            - SUPERSEDED
            - REJECTED
          territorial_scope:
            type: string
            enum:
            - SITE
            - REGION
            - TERRITORY
            - CONTINENTAL
            - PLANETARY
          crs:
            type: string
            description: EPSG:xxxx
          candidates:
            type: array
            items:
              type: object
              required:
              - candidate_id
              - where
              - why
              properties:
                candidate_id:
                  type: string
                where:
                  type: object
                why:
                  type: string
                  minLength: 1
                rank:
                  type: integer
                  minimum: 1
                evidence_refs:
                  type: array
                  items:
                    type: string
                    description: event_id de evidencia CEFEIDA
          supersedes:
            type:
            - string
            - 'null'
      status: ACTIVE
  liceu.cefeida.evidence:
    1.0.0:
      contract_version: 1.0.0
      event_type: cefeida.evidence.published
      classification: AUTHORITATIVE_EVENT
      posicao_na_cadeia: 2
      owner: liceu.cefeida
      allowed_producers:
      - liceu.cefeida
      required_envelope_fields:
      - artifact_id
      - trace_id
      - observed_at
      forbidden_envelope_fields:
        decision_id: 'CEFEIDA calcula, JOHN interpreta. Correlacao ou forecast nunca vira decisao. Discovery
          encontrou john_decision_engine.py dentro do CEFEIDA — este campo torna esse padrao rejeitavel
          no publish.

          '
        governance_decision_id: CEFEIDA nao autoriza
        execution_id: CEFEIDA nao executa
      authority_invariants:
      - 'evidencia e reproduzivel: mesma fonte + metodo + versao => mesmo valor'
      - forecast sempre acompanhado de confidence e horizonte
      - evidencia nunca carrega recomendacao
      domain_invariants:
      - source_refs nao vazio — evidencia sem fonte nao e evidencia
      - method_version presente para reproducibilidade
      - confidence obrigatorio quando kind = FORECAST
      payload_schema:
        type: object
        required:
        - evidence_kind
        - metric
        - value
        - unit
        - source_refs
        - method_version
        additionalProperties: false
        properties:
          evidence_kind:
            type: string
            enum:
            - OBSERVATION
            - METRIC
            - FORECAST
            - ANOMALY
            - TREND
            - STATISTICAL_EVIDENCE
          metric:
            type: string
            minLength: 1
          value:
            type:
            - number
            - string
            - object
          unit:
            type: string
          confidence:
            type: number
            minimum: 0
            maximum: 1
          horizon:
            type: string
            description: ISO 8601 duration; obrigatorio em FORECAST
          source_refs:
            type: array
            minItems: 1
            items:
              type: string
          method_version:
            type: string
          subject_ref:
            type: string
            description: artifact_id do objeto observado
      status: ACTIVE
  liceu.john.recommendation:
    1.0.0:
      contract_version: 1.0.0
      event_type: john.recommendation.generated
      classification: AUTHORITATIVE_EVENT
      posicao_na_cadeia: 3
      owner: liceu.john
      allowed_producers:
      - liceu.john
      required_envelope_fields:
      - artifact_id
      - trace_id
      - causation_id
      - decision_id
      forbidden_envelope_fields:
        governance_decision_id: 'RECOMMENDATION != AUTHORIZATION. Se o produtor da recomendacao pudesse
          emitir governance_decision_id, ele provaria a propria autorizacao. Esse campo pertence exclusivamente
          ao liceu.anchor.

          '
        execution_id: JOHN nao executa
      authority_invariants:
      - recomendacao NUNCA e autorizacao
      - toda recomendacao preserva lineage ate a evidencia que a sustenta
      - confidence e rationale sao obrigatorios — sem caixa-preta
      - 'VIOLACAO CONHECIDA: discovery encontrou este evento produzido por liceu.opera em apps/opera/api/construction.py.
        O executor produzindo a recomendacao que legitima a propria execucao fabrica historia legitima.
        allowed_producers rejeita isso no publish.

        '
      domain_invariants:
      - alternatives com pelo menos 2 itens — recomendar sem alternativa nao e decidir
      - recommended_alternative_id deve existir em alternatives
      - evidence_refs nao vazio
      payload_schema:
        type: object
        required:
        - alternatives
        - recommended_alternative_id
        - confidence
        - rationale
        - evidence_refs
        additionalProperties: false
        properties:
          alternatives:
            type: array
            minItems: 2
            items:
              type: object
              required:
              - alternative_id
              - summary
              properties:
                alternative_id:
                  type: string
                summary:
                  type: string
                risk:
                  type: object
          recommended_alternative_id:
            type: string
          confidence:
            type: number
            minimum: 0
            maximum: 1
          rationale:
            type: array
            minItems: 1
            items:
              type: object
              required:
              - factor
              - weight
              properties:
                factor:
                  type: string
                weight:
                  type: number
                direction:
                  type: string
                  enum:
                  - POSITIVE
                  - NEGATIVE
                  - NEUTRAL
          evidence_refs:
            type: array
            minItems: 1
            items:
              type: string
          mode:
            type: string
            enum:
            - CONSERVATIVE
            - BALANCED
            - AGGRESSIVE
      status: ACTIVE
  liceu.anchor.authorization:
    1.1.0:
      contract_version: 1.1.0
      event_type: anchor.authorization.granted
      classification: AUTHORITATIVE_EVENT
      posicao_na_cadeia: 4
      owner: liceu.anchor
      allowed_producers:
      - liceu.anchor
      required_envelope_fields:
      - artifact_id
      - trace_id
      - causation_id
      - decision_id
      - governance_decision_id
      forbidden_envelope_fields:
        execution_id: 'ANCHOR autoriza, OPERA executa. Se o autorizador emitisse execution_id, autoridade
          e execucao coabitariam — que e exatamente a violacao encontrada no ANCHOR (governanca junto
          de maintenance/asset/precon).

          '
      authority_invariants:
      - causation_id DEVE apontar para um john.recommendation.generated
      - 'nao autoriza a si proprio: producer da causa != producer deste evento'
      - subject_ref liga a autorizacao ao objeto EXATO aprovado (hash + versao)
      - 'deny-by-default: ausencia de autorizacao nao e autorizacao'
      - legal_basis_refs e REFERENCIA, nunca afirmacao. O ANCHOR tem autoridade institucional, nao juridica;
        declarar cobertura seria autoridade fabricada.
      - 'legal_coverage e derivado pelo CORE: COVERED se as referencias resolvem para fatos do liceu.legal;
        UNCOVERED se ausentes ou se scale > liceu.legal.scale_max; NOT_APPLICABLE se o subject_ref resolve
        para capacidade sem efeito externo.'
      - subject_ref irresolvivel ou capacidade nao classificada -> BLOCKED, nunca NOT_APPLICABLE por omissao
        (P04).
      domain_invariants:
      - policy_refs nao vazio — autorizacao sem politica e arbitrio
      - 'subject_content_hash obrigatorio: aprova-se uma versao, nao um nome'
      - decision = GRANTED | DENIED; DENIED tambem e fato autoritativo
      - cada legal_basis_ref deve resolver para fato cujo producer_id seja liceu.legal
      - legal_basis_refs nao pode referenciar o proprio evento
      - legal_basis_refs preenchido e incompativel com NOT_APPLICABLE
      payload_schema:
        type: object
        required:
        - decision
        - subject_ref
        - subject_content_hash
        - subject_version
        - policy_refs
        - authority_scope
        additionalProperties: false
        properties:
          decision:
            type: string
            enum:
            - GRANTED
            - DENIED
          subject_ref:
            type: string
          subject_content_hash:
            type: string
            minLength: 32
          subject_version:
            type: string
          policy_refs:
            type: array
            minItems: 1
            items:
              type: string
          authority_scope:
            type: string
          conditions:
            type: array
            items:
              type: string
          valid_until:
            type:
            - string
            - 'null'
            format: date-time
          denial_reason:
            type: string
            description: obrigatorio quando DENIED
          legal_basis_refs:
            type: array
            items:
              type: string
            description: 'referencias a fatos do liceu.legal que fundamentam a autorizacao. VAZIO OU AUSENTE
              = sem cobertura juridica referenciada. NAO e afirmacao de cobertura: legal_coverage e DERIVADO
              pelo CORE a partir destas referencias.'
      changelog_1_1_0: 'MINOR: acrescenta legal_basis_refs (opcional). Nenhum campo existente alterado;
        consumidores de 1.0.0 permanecem validos.'
      status: ACTIVE
    1.0.0:
      contract_version: 1.0.0
      event_type: anchor.authorization.granted
      classification: AUTHORITATIVE_EVENT
      posicao_na_cadeia: 4
      owner: liceu.anchor
      allowed_producers:
      - liceu.anchor
      required_envelope_fields:
      - artifact_id
      - trace_id
      - causation_id
      - decision_id
      - governance_decision_id
      forbidden_envelope_fields:
        execution_id: 'ANCHOR autoriza, OPERA executa. Se o autorizador emitisse execution_id, autoridade
          e execucao coabitariam — que e exatamente a violacao encontrada no ANCHOR (governanca junto
          de maintenance/asset/precon).

          '
      authority_invariants:
      - causation_id DEVE apontar para um john.recommendation.generated
      - 'nao autoriza a si proprio: producer da causa != producer deste evento'
      - subject_ref liga a autorizacao ao objeto EXATO aprovado (hash + versao)
      - 'deny-by-default: ausencia de autorizacao nao e autorizacao'
      domain_invariants:
      - policy_refs nao vazio — autorizacao sem politica e arbitrio
      - 'subject_content_hash obrigatorio: aprova-se uma versao, nao um nome'
      - decision = GRANTED | DENIED; DENIED tambem e fato autoritativo
      payload_schema:
        type: object
        required:
        - decision
        - subject_ref
        - subject_content_hash
        - subject_version
        - policy_refs
        - authority_scope
        additionalProperties: false
        properties:
          decision:
            type: string
            enum:
            - GRANTED
            - DENIED
          subject_ref:
            type: string
          subject_content_hash:
            type: string
            minLength: 32
          subject_version:
            type: string
          policy_refs:
            type: array
            minItems: 1
            items:
              type: string
          authority_scope:
            type: string
          conditions:
            type: array
            items:
              type: string
          valid_until:
            type:
            - string
            - 'null'
            format: date-time
          denial_reason:
            type: string
            description: obrigatorio quando DENIED
      status: DEPRECATED
      deprecated_em: 1.1.0
      motivo: substituida por 1.1.0, que acrescenta legal_basis_refs
  liceu.opera.execution:
    1.0.0:
      contract_version: 1.0.0
      event_type: opera.execution.created
      classification: AUTHORITATIVE_EVENT
      posicao_na_cadeia: 5
      owner: liceu.opera
      allowed_producers:
      - liceu.opera
      required_envelope_fields:
      - artifact_id
      - trace_id
      - causation_id
      - governance_decision_id
      - execution_id
      forbidden_envelope_fields:
        decision_id: 'OPERA nao produz decisao propria. Herda decision_id pela cadeia (recommendation
          -> authorization). Emitir decision_id proprio seria criar justificativa estrategica retroativamente.

          '
      authority_invariants:
      - causation_id DEVE apontar para anchor.authorization.granted com decision=GRANTED
      - governance_decision_id herdado, nunca gerado por OPERA
      - execucao sem autorizacao valida e rejeitada no publish
      - rollback nunca apaga lineage — gera novo fato de supersessao
      domain_invariants:
      - authorized_subject_hash deve casar com subject_content_hash da autorizacao
      - execution_status inicia em CREATED
      payload_schema:
        type: object
        required:
        - execution_status
        - authorized_subject_ref
        - authorized_subject_hash
        - work_items
        additionalProperties: false
        properties:
          execution_status:
            type: string
            enum:
            - CREATED
            - SCHEDULED
            - RUNNING
            - BLOCKED
            - COMPLETED
            - ROLLED_BACK
            - SUPERSEDED
          authorized_subject_ref:
            type: string
          authorized_subject_hash:
            type: string
            minLength: 32
          work_items:
            type: array
            minItems: 1
            items:
              type: object
              required:
              - work_item_id
              - description
              properties:
                work_item_id:
                  type: string
                description:
                  type: string
                assigned_authority:
                  type: string
                  description: liceu.bim | liceu.suppliers | ...
          blocked_reason:
            type: string
            description: 'padrao BLOCKED: input autoritativo ausente -> nao inventar valor'
      status: ACTIVE
  liceu.cea.financial-exposure:
    1.0.0:
      contract_version: 1.0.0
      event_type: cea.financial.exposure.assessed
      classification: AUTHORITATIVE_EVENT
      posicao_na_cadeia: null
      owner: liceu.cea
      allowed_producers:
      - liceu.cea
      substitui: wave83.financial_exposure (nome de wave, nao de contrato)
      required_envelope_fields:
      - artifact_id
      - trace_id
      forbidden_envelope_fields:
        decision_id: CEA avalia viabilidade financeira no proprio dominio; nao produz decisao cognitiva.
          decision_id pertence ao liceu.john.
        governance_decision_id: CEA tem may_authorize vazio. Autorizacao e do liceu.anchor.
        execution_id: CEA nao executa. Execucao e do liceu.opera.
      authority_invariants:
      - exposicao financeira e avaliacao, nunca aprovacao de funding
      - financial_viability e conclusao de dominio do CEA, nao autorizacao
      - lineage ate o impacto economico que originou a exposicao e obrigatoria
      domain_invariants:
      - economic_impact_id nao vazio — exposicao sem impacto de origem nao e rastreavel
      - npv presente quando financial_viability != inviavel
      - scenarios contem ao menos o cenario base
      payload_schema:
        type: object
        additionalProperties: false
        required:
        - financial_exposure_id
        - economic_impact_id
        - financial_exposure
        - npv
        - financial_viability
        - scenarios
        properties:
          financial_exposure_id:
            type: string
            minLength: 1
          economic_impact_id:
            type: string
            minLength: 1
          financial_exposure:
            type: number
          npv:
            type: number
          irr:
            type: number
          financial_viability:
            type: string
            enum:
            - viavel
            - revisar
            - inviavel
            description: conclusao de dominio do CEA — NAO e autorizacao de funding
          cumulative_financial_impact:
            type: number
          scenarios:
            type: object
            minProperties: 1
            description: cenarios avaliados; deve conter 'base'
          sensitivity:
            type: object
          lineage:
            type: object
      status: ACTIVE
  liceu.cea.continental-financial-exposure:
    1.0.0:
      contract_version: 1.0.0
      event_type: cea.financial.exposure.continental.assessed
      classification: AUTHORITATIVE_EVENT
      posicao_na_cadeia: null
      owner: liceu.cea
      allowed_producers:
      - liceu.cea
      substitui: wave92.continental_financial_exposure
      required_envelope_fields:
      - artifact_id
      - trace_id
      - causation_id
      - parent_event_id
      forbidden_envelope_fields:
        decision_id: consolidacao continental nao e decisao cognitiva
        governance_decision_id: CEA nao autoriza
        execution_id: CEA nao executa
      authority_invariants:
      - 'evento derivado: causation_id DEVE apontar para o fato consolidado'
      - parent_event_id e causation_id sao campos de ENVELOPE, nao de payload. O codigo atual os carrega
        DENTRO do payload — a migracao deve move-los, senao o lineage fica invisivel para o Event Store.
      - consolidacao nunca reescreve exposicoes de origem; gera fato novo
      domain_invariants:
      - source_exposure_ids nao vazio — consolidacao sem origem nao e consolidacao
      - financial_summary presente
      payload_schema:
        type: object
        additionalProperties: false
        required:
        - financial_exposure_id
        - source_exposure_ids
        - financial_summary
        properties:
          financial_exposure_id:
            type: string
            minLength: 1
          source_exposure_ids:
            type: array
            minItems: 1
            items:
              type: string
          financial_summary:
            type: object
          audit:
            type: object
            description: rastreabilidade da consolidacao
      status: ACTIVE
  liceu.authority.human-decision:
    1.0.0:
      contract_id: liceu.authority.human-decision
      contract_version: 1.0.0
      status: RETIRED
      owner: liceu.authority
      allowed_producers:
      - liceu.authority
      event_type: authority.human.decision.recorded
      posicao_na_cadeia: 6
      proposito: registrar decisao humana de contingencia como fato canonico com lineage. O humano nao
        escreve no banco nem entra por rota paralela.
      required_envelope_fields:
