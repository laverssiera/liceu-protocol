meta:
  artifact: LICEU_PRODUCER_REGISTRY
  registry_version: 1.4.0
  constitution_version: 1.16.0
  fase: P2.2
  regra: producer_id e IDENTIDADE, imutavel e independente de geografia. Localizacao vive em federation_id/node_id/scope.
    Multiplas instancias da mesma classe sao legitimas.
  constitution_sha256: c4c421d0fe22576aea5eeb242224ab3fd1138e3b6a6d8cc094b2fc512830b1f5
  constitution_compatibility: 'compativel com 1.15.0: acrescenta Mandate Plane, liceu.mandate (posicao 0) e P08. Nenhuma capacidade, teto ou contrato existente alterado.'
  external_effect_criterio:
  - cria obrigacao perante terceiro
  - movimenta ou compromete capital
  - despacha trabalho ou move recurso fisico
  - altera ativo fisico
  external_effect_regra: 'classificado por CAPACIDADE, nunca por produtor: 4 dos 15 sao mistos e ficariam
    errados se classificados por produtor. Efeito INDIRETO nao conta (decisao CC1): um ranking que induz
    aquisicao permanece interno, porque o efeito e do ato de adquirir.'
  external_effect_uso: usado para DERIVAR legal_coverage=NOT_APPLICABLE no contrato liceu.anchor.authorization.
    Subject de capacidade sem efeito externo -> NOT_APPLICABLE. Subject irresolvivel ou nao classificado
    -> BLOCKED, nunca NOT_APPLICABLE por omissao (P04).
  external_effect_condicoes:
    liceu.research.experimentos_em_ambiente_isolado:
      classificado: false
      depende_do_gate: PD_HARDWARE_BRIDGE_IS_STUB
      se_o_gate_cair: passa a external_effect=true
  teto_semantica:
    o_que_e: ALCADA — ate que degrau o monolito exerce a propria capacidade SOZINHO
    nao_confundir_com: 'scale_max, que e MANDATO: ate que degrau ele pode REIVINDICAR alcance'
    aplica_a:
    - may_decide
    - may_authorize
    - may_execute
    CORRECAO: o teto NAO pertence a may_decide. ANCHOR exerce alcada sobre may_authorize e OPERA sobre
      may_execute. Nenhum mandato foi alterado.
    invariante: teto_externo <= teto_interno <= scale_max
    granularidade: '[DECIDIDO TA1] dois tetos por produtor, nao por classe de capacidade'
    regra_de_avaliacao:
    - 1. obter a capacidade que originou o fato
    - 2. consultar external_effect dessa capacidade
    - 3. teto_aplicavel = teto_externo se external_effect senao teto_interno
    - 4. se event.scale <= teto_aplicavel -> decide sozinho
    - 5. senao -> ESCALA para a Mae
    teto_externo_NENHUM: 'significa duas coisas distintas: (a) o produtor nao tem capacidade externa —
      vacuo, ver teto_externo_aplicavel; ou (b) tem, mas nao pode exerce-la sozinho em nenhum degrau.
      Hoje todos os NENHUM sao caso (a).'
  nota_classe_de_autoridade: liceu.authority e a 16a CLASSE canonica, nao o 16o monolito. Produz exclusivamente
    fatos de autoridade e governanca federativa.
  contagem:
    soberanos: 15
    classes_de_autoridade: 1
    total: 16
